<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Vaishnavi ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- STARS -->
<div class="stars"></div>

<!-- SHOOTING STARS -->
<div class="shooting-star star1"></div>
<div class="shooting-star star2"></div>
<div class="shooting-star star3"></div>

<!-- ========================= -->
<!-- COVER PAGE -->
<!-- ========================= -->

<section id="coverPage" class="page active">

<img
src="cover.png"
class="cover-image"
alt="cover">

<div class="cover-overlay">

<h1 class="cover-title">
Dabbaaa.... ❤️
</h1>

<p class="cover-subtitle">
A little surprise for you ✨
</p>

<button
class="main-btn"
onclick="startMemories()">

Open ❤️

</button>

</div>

</section>

<!-- ========================= -->
<!-- MEMORY PAGE -->
<!-- ========================= -->

<section id="memoryPage" class="page">

<div class="memory-card">

<h2 id="memoryTitle">
🐱 A little memory ✨
</h2>

<!-- CLOSED MEMORY -->

<div id="memoryClosed">

<button
class="gift-btn"
onclick="openMemory()">

🎁 Click to Open Memory ❤️

</button>

</div>

<!-- OPEN MEMORY -->

<div
id="memoryOpened"
style="display:none;">

<img
id="memoryImage"
class="memory-image"
src="photo1.jpg"
alt="memory">

<h3 id="memoryCaption">
Vaishnavi ❤️
</h3>

<button
class="next-btn"
onclick="nextMemory()">

Next →

</button>

</div>

</div>

</section>

<!-- ========================= -->
<!-- SPECIAL NOTE PAGE -->
<!-- ========================= -->

<section id="notePage" class="page">

<div class="note-card">

<!-- CLOSED NOTE -->

<div id="noteClosed">

<button
class="gift-btn"
onclick="openNote()">

💌 Click to Open Special Note ❤️

</button>

</div>

<!-- OPEN NOTE -->

<div
id="noteOpened"
style="display:none;">

<h2>
Special Note ❤️
</h2>

<div
id="typewriter"
class="note-text">
</div>

<button
class="next-btn"
onclick="showFinalPage()">

Continue ✨

</button>

</div>

</div>

</section>

<!-- ========================= -->
<!-- FINAL PAGE -->
<!-- ========================= -->

<section id="finalPage" class="page">

<div class="final-container">

<!-- CAT -->

<img
src="cat.png"
id="cat"
class="cat-character"
alt="cat">

<!-- CHICK -->

<img
src="chick.png"
id="chick"
class="chick-character"
alt="chick">

<!-- HEART -->

<div
id="heart"
class="heart-center">

❤️

</div>

<!-- FINAL TEXT -->

<div
id="finalText"
class="final-text">

<h1>

Happy Birthday
<br>
Vaishnavi ❤️

</h1>

<p>

More beautiful memories await...
✨

</p>

<button
class="main-btn"
onclick="replayStory()">

❤️ Replay Memories ❤️

</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
